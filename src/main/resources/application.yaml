server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cafeteria_db
    username: postgres
    password: secretpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000